<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ダイセーウチ ACT</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #071018;
      overflow: hidden;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Yu Gothic UI", "Yu Gothic", Meiryo, sans-serif;
    }
    #wrap { position: relative; }
    canvas {
      display: block;
      background: #071018;
      touch-action: none;
      outline: none;
    }
    #touch {
      display: none;
      position: absolute;
      left: 0;
      right: 0;
      bottom: 10px;
      padding: 0 12px;
      gap: 10px;
      box-sizing: border-box;
    }
    #touch button {
      flex: 1;
      height: 68px;
      font-size: 22px;
      border-radius: 14px;
      border: 3px solid #163044;
      background: rgba(255, 255, 255, 0.88);
      font-weight: 700;
      color: #163044;
      font-family: inherit;
    }
    #touch button.jump { flex: 1.4; background: #ffd15c; }
    @media (pointer: coarse) {
      #touch { display: flex; }
    }
  </style>
</head>
<body>
  <div id="wrap">
    <canvas id="c" width="960" height="540" tabindex="0"></canvas>
    <div id="touch">
      <button type="button" id="bL" aria-label="左">◀</button>
      <button type="button" id="bR" aria-label="右">▶</button>
      <button type="button" id="bJ" class="jump" aria-label="ジャンプ">ジャンプ</button>
    </div>
  </div>
  <script src="game.js?v=22"></script>
</body>
</html>
